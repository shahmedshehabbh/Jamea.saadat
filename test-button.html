<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار سريع للزر</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #f0f0f0; }
    .test { padding: 15px; margin: 10px 0; background: white; border-radius: 5px; }
    .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #DAA520; color: white; border: none; border-radius: 50%; margin: 20px; }
    .info { background: #e3f2fd; padding: 15px; margin: 10px 0; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🧪 اختبار بسيط</h1>
  
  <div class="info">
    <h3>الخطوات:</h3>
    <ol>
      <li>انقر على الزر الذهبي <strong>＋</strong> أدناه</li>
      <li>يجب أن تظهر رسالة تأكيد</li>
      <li>إذا ظهرت الرسالة = الزر يعمل ✅</li>
      <li>إذا لم تظهر = هناك مشكلة ❌</li>
    </ol>
  </div>

  <button class="btn" id="testBtn">＋</button>

  <div id="result" style="font-size: 20px; font-weight: bold;"></div>

  <hr style="margin: 30px 0;">
  
  <a href="index.html" style="padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px; display: inline-block;">🏠 افتح الموقع الرئيسي</a>

  <script>
    console.log('✅ JavaScript يعمل');
    
    document.getElementById('testBtn').addEventListener('click', function() {
      console.log('✅ الزر تم النقر عليه');
      document.getElementById('result').innerHTML = '✅ الزر يعمل بنجاح! الآن جرب الموقع الرئيسي.';
      document.getElementById('result').style.color = 'green';
    });
    
    console.log('✅ Event Listener تم ربطه');
  </script>
</body>
</html>
